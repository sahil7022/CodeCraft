<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_57 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_57" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_57');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const container = document.querySelector('.auth-card-container');
const loginTab = document.querySelector('#login-tab');
const registerTab = document.querySelector('#register-tab');
const loginForm = document.querySelector('#login-form');
const registerForm = document.querySelector('#register-form');
const indicator = document.querySelector('#tab-indicator');

if (loginTab && registerTab) {
    loginTab.addEventListener('click', () => {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        indicator.style.transform = 'translateX(0)';
        loginTab.classList.add('text-primary');
        registerTab.classList.remove('text-primary');
    });

    registerTab.addEventListener('click', () => {
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        indicator.style.transform = 'translateX(100%)';
        registerTab.classList.add('text-primary');
        loginTab.classList.remove('text-primary');
    });
}

// Particle background effect for the auth card
function createParticles() {
    const bg = document.querySelector('.auth-bg-particles');
    if (!bg) return;
    for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'absolute bg-primary/20 rounded-full blur-xl animate-pulse';
        const size = Math.random() * 100 + 50;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${Math.random() * 100}%`;
        p.style.top = `${Math.random() * 100}%`;
        p.style.animationDelay = `${Math.random() * 5}s`;
        bg.appendChild(p);
    }
}
createParticles();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_57 -->
</body>
</html>
